services:
  mongodb:
    image: mongo:7
    container_name: gestion_stage_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: gestion_stage_backend
    # Port publié pour le debug direct (optionnel : le trafic normal
    # passe désormais par Nginx). Peut être retiré en prod stricte.
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/gestion_stages
      JWT_SECRET: gestion_stage_secret_key
      # Identifiants Cloudinary (lus depuis l'environnement hôte / .env racine).
      # Ne jamais coder les secrets en dur ici.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      # Volume NOMMÉ : les fichiers uploadés survivent à restart / down / rebuild.
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # Build Angular avec apiUrl = /api (reverse proxy Nginx).
        BUILD_CONFIGURATION: docker
    container_name: gestion_stage_frontend
    # Port publié pour le debug direct (optionnel).
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network

  # =========================================================
  #  Reverse Proxy Nginx = point d'entrée UNIQUE
  #  Utilisateur ──► http://localhost:8080
  #                   ├── /         ──► frontend (Angular)
  #                   ├── /api/     ──► backend  (Express)
  #                   └── /uploads/ ──► backend  (fichiers téléversés)
  # =========================================================
  nginx:
    image: nginx:alpine
    container_name: gestion_stage_nginx
    ports:
      - "8080:80"
    volumes:
      # Monte notre configuration en lecture seule (ro).
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # =========================================================
  #  Monitoring
  #  Prometheus ──► scrape http://backend:5000/metrics (15s)
  #  Grafana    ──► lit Prometheus comme source de données
  #                 http://localhost:3001 (admin/admin par défaut)
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: gestion_stage_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Configuration montée en lecture seule (ro) : Prometheus n'a
      # jamais besoin d'y écrire.
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Volume NOMMÉ : les séries temporelles survivent à un restart.
      - prometheus_data:/prometheus
    command:
      # On redéclare les flags par défaut car spécifier "command" les écrase.
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Rétention : 15 jours de séries temporelles (évite que le volume
      # ne grossisse indéfiniment sur un poste de dev).
      - "--storage.tsdb.retention.time=15d"
      # Active /-/reload et /-/quit (rechargement de conf sans restart).
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: gestion_stage_grafana
    restart: unless-stopped
    ports:
      # Grafana écoute sur 3000 dans le conteneur, publié sur 3001
      # côté hôte pour ne pas entrer en conflit avec un dev server.
      - "3001:3000"
    environment:
      # Identifiants admin (surchargeables depuis le .env racine).
      # Valeurs par défaut adaptées à un usage LOCAL uniquement.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Pas d'inscription libre : seul l'admin peut créer des comptes.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Volume NOMMÉ : dashboards, sources de données et utilisateurs
      # survivent à un restart / rebuild.
      - grafana_data:/var/lib/grafana
      # Provisioning : la source de données Prometheus est créée
      # automatiquement au démarrage (aucun clic dans l'UI).
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - app-network

# Réseau Docker partagé : c'est lui qui permet aux conteneurs
# de communiquer entre eux par leur NOM DE SERVICE (dns interne Docker).
networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
  prometheus_data:
  grafana_data:
